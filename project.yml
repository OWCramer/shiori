name: VNHub
options:
  bundleIdPrefix: com.owencramer
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    exactVersion: 8.12.0
  SteamKit:
    path: Packages/SteamKit
  ArtemisKit:
    path: Packages/ArtemisKit
  KiriKiriKit:
    path: Packages/KiriKiriKit
targets:
  VNHub:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes: ["KiriKiriSchemes/**"]
      # CxDec schemes for KiriKiri titles, by Steam app id (Scripts/kirikiri/garbro-cx.py).
      - path: App/Resources/KiriKiriSchemes
        type: folder
        buildPhase: resources
      - path: App/RenPy
        # runtime_shim.c is linked into the runtime frameworks, not the app.
        excludes: ["*.py", "IAPHelper.m", "runtime_shim.c"]
      # Ren'Py's own StoreKit 1 helper, kept as shipped in renios.
      - path: App/RenPy/IAPHelper.m
        compilerFlags: ["-Wno-deprecated-declarations"]
      - path: App/RenPy/vnhub_main.py
        buildPhase: resources
      - path: App/RenPy/vnhub_main2.py
        buildPhase: resources
      # Ren'Py 7.8.7's engine code and Python 2.7 library (Scripts/build-renpy-runtimes.sh).
      - path: Vendor/RenPy7Base
        type: folder
        buildPhase: resources
    # Merged with the generated Info.plist. Game folders in Documents show up in the Files
    # app and can be edited in place (no INFOPLIST_KEY_ build setting exists for these).
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIFileSharingEnabled: true
        # iOS 26 continued-processing tasks keep a download running in the background.
        BGTaskSchedulerPermittedIdentifiers: ["com.owencramer.vnhub.download.*"]
        UIBackgroundModes: ["processing"]
        LSSupportsOpeningDocumentsInPlace: true
        # Game Mode (lower Bluetooth latency for controllers and AirPods, background work
        # throttled) while the app is full screen: opt in, and say it's a game.
        GCSupportsGameMode: true
        LSApplicationCategoryType: public.app-category.adventure-games
    # iCloud Documents container that mirrors each game's saves/ (SaveSync).
    entitlements:
      path: App/VNHub.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: ["iCloud.com.owencramer.vnhub"]
        com.apple.developer.ubiquity-container-identifiers: ["iCloud.com.owencramer.vnhub"]
        com.apple.developer.icloud-services: ["CloudDocuments"]
        # Visual novels hold full-screen textures; ask iOS for the larger per-app memory
        # limit (Game Mode doesn't raise it).
        com.apple.developer.kernel.increased-memory-limit: true
    dependencies:
      - package: SteamKit
        product: SteamKit
      - package: ArtemisKit
        product: ArtemisKit
      - package: Kingfisher
      - package: KiriKiriKit
        product: CKiriKiri
      - package: KiriKiriKit
        product: CKiriKiriMetal
      # AetherKrkr, the KiriKiri runtime (GPL-3.0), with its dependencies inside one image
      # (Scripts/kirikiri/build-ios-framework.sh). Exports only the engine API.
      - framework: Vendor/ShioriKiriKiri.xcframework
        embed: true
      # Ren'Py runtimes from Scripts/build-renpy-runtimes.sh, loaded with dlopen when a game
      # starts (each carries its own CPython and SDL2, so they can't both be linked).
      - framework: Vendor/RenPy8.xcframework
        embed: true
        link: false
      - framework: Vendor/RenPy7.xcframework
        embed: true
        link: false
      # Linked by the app itself so it loads at launch, ahead of Apple's OpenGLES: SDL looks
      # GL functions up with dlsym(RTLD_DEFAULT, ...), which returns the first image's.
      - framework: Vendor/renios/MetalANGLE.xcframework
        embed: true
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMotion.framework
      - sdk: CoreServices.framework
      - sdk: GameController.framework
      - sdk: ImageIO.framework
      - sdk: QuartzCore.framework
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owencramer.vnhub
        PRODUCT_NAME: VN Hub
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shiori
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: App/RenPy/VNHub-Bridging-Header.h
schemes:
  VNHub:
    build:
      targets:
        VNHub: all
