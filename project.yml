name: Shiori
options:
  bundleIdPrefix: com.owencramer
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    exactVersion: 8.12.0
  SteamKit:
    path: Packages/SteamKit
  ArtemisKit:
    path: Packages/ArtemisKit
  KiriKiriKit:
    path: Packages/KiriKiriKit
  SiglusKit:
    path: Packages/SiglusKit
  LucaKit:
    path: Packages/LucaKit
  CatSystemKit:
    path: Packages/CatSystemKit
targets:
  Shiori:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes: ["SiglusFonts/**"]
      # BIZ UDGothic (SIL OFL), metric-compatible with MS Gothic, for Siglus games that ask
      # for the Windows font (SiglusRuntime links it in as the game's font/ folder).
      - path: App/Resources/SiglusFonts
        type: folder
        buildPhase: resources
      - path: App/RenPy
        # runtime_shim.c is linked into the runtime frameworks, not the app.
        excludes: ["*.py", "IAPHelper.m", "runtime_shim.c"]
      # Ren'Py's own StoreKit 1 helper, kept as shipped in renios.
      - path: App/RenPy/IAPHelper.m
        compilerFlags: ["-Wno-deprecated-declarations"]
      - path: App/RenPy/shiori_main.py
        buildPhase: resources
      - path: App/RenPy/shiori_main2.py
        buildPhase: resources
      # Ren'Py 7.8.7's engine code and Python 2.7 library (Scripts/build-renpy-runtimes.sh).
      - path: Vendor/RenPy7Base
        type: folder
        buildPhase: resources
      # Ren'Py 8.1.3's engine code and Python library, for Ren'Py 8.0 games.
      - path: Vendor/RenPy8Base
        type: folder
        buildPhase: resources
    # Merged with the generated Info.plist. Game folders in Documents show up in the Files
    # app and can be edited in place (no INFOPLIST_KEY_ build setting exists for these).
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIFileSharingEnabled: true
        # iPad trackpads and mice as real pointers: clicks with buttons (right click),
        # hover and scroll wheels, which SDL (Ren'Py) and the game views read.
        UIApplicationSupportsIndirectInputEvents: true
        # iOS 26 continued-processing tasks keep a download running in the background.
        BGTaskSchedulerPermittedIdentifiers: ["com.owencramer.vnhub.download.*"]
        UIBackgroundModes: ["processing"]
        LSSupportsOpeningDocumentsInPlace: true
        # Game Mode (lower Bluetooth latency for controllers and AirPods, background work
        # throttled) while the app is full screen: opt in, and say it's a game.
        GCSupportsGameMode: true
        LSApplicationCategoryType: public.app-category.adventure-games
        # Export compliance (the user, 2026-10-10): encryption only for HTTPS, Steam sign-in and
        # decrypting owned game content, all exempt; App Store Connect stops asking per upload.
        ITSAppUsesNonExemptEncryption: false
    # iCloud Documents container that mirrors each game's saves/ (SaveSync).
    entitlements:
      path: App/Shiori.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: ["iCloud.com.owencramer.vnhub"]
        com.apple.developer.ubiquity-container-identifiers: ["iCloud.com.owencramer.vnhub"]
        com.apple.developer.icloud-services: ["CloudDocuments"]
        # Visual novels hold full-screen textures; ask iOS for the larger per-app memory
        # limit (Game Mode doesn't raise it).
        com.apple.developer.kernel.increased-memory-limit: true
    dependencies:
      - package: SteamKit
        product: SteamKit
      - package: ArtemisKit
        product: ArtemisKit
      - package: Kingfisher
      - package: KiriKiriKit
        product: CKiriKiri
      - package: KiriKiriKit
        product: CKiriKiriMetal
      # AetherKrkr, the KiriKiri runtime (GPL-3.0), with its dependencies inside one image
      # (Scripts/kirikiri/build-ios-framework.sh). Exports only the engine API.
      - framework: Vendor/ShioriKiriKiri.xcframework
        embed: true
      - package: SiglusKit
        product: CSiglus
      - package: LucaKit
        product: LucaKit
      # CatSystem2 (NEKOPARA Vol. 3), Shiori's own interpreter. iPhone and iPad only for now.
      - package: CatSystemKit
        product: CatSystemKit
      # siglus_rs, the SiglusEngine runtime (MPL-2.0), as one dynamic framework
      # (Scripts/siglus/build-ios-framework.sh). Exports only the engine's C interface.
      - framework: Vendor/ShioriSiglus.xcframework
        embed: true
      # libvpx's VP9 decoder, static (Scripts/luca/build-ios-vpx.sh): Luca System movies and
      # animated effects are VP9 WebM.
      - framework: Vendor/ShioriVPX.xcframework
        embed: false
      # FFmpeg's ASF demuxer and WMV 9 / WMA 2 decoders only, static, LGPL-2.1+
      # (Scripts/catsystem/build-ios-ffmpeg.sh): NEKOPARA Vol. 3's movies are WMV.
      - framework: Vendor/ShioriFFmpeg.xcframework
        embed: false
      # Ren'Py runtimes from Scripts/build-renpy-runtimes.sh, loaded with dlopen when a game
      # starts (each carries its own CPython and SDL2, so they can't both be linked).
      - framework: Vendor/RenPy8.xcframework
        embed: true
        link: false
      - framework: Vendor/RenPy7.xcframework
        embed: true
        link: false
      # Linked by the app itself so it loads at launch, ahead of Apple's OpenGLES: SDL looks
      # GL functions up with dlsym(RTLD_DEFAULT, ...), which returns the first image's.
      - framework: Vendor/renios/MetalANGLE.xcframework
        embed: true
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMotion.framework
      - sdk: CoreServices.framework
      - sdk: GameController.framework
      - sdk: ImageIO.framework
      - sdk: QuartzCore.framework
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owencramer.vnhub
        PRODUCT_NAME: Shiori
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shiori
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: App/RenPy/Shiori-Bridging-Header.h
        # MetalFX (KiriKiri upscaling) exists in the device SDK only.
        "OTHER_LDFLAGS[sdk=iphoneos*]": ["$(inherited)", "-framework", "MetalFX"]
  # Apple TV (Phase 15): the same app on tvOS, sharing the code. KiriKiri and Siglus, whose
  # native frameworks aren't built for tvOS yet, are left out; Ren'Py, Artemis and Luca play.
  ShioriTV:
    type: application
    platform: tvOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources
        excludes: ["Engines/KiriKiri/**", "Engines/Siglus/**", "Engines/CatSystem/**"]
      - path: App/Resources
        excludes: ["SiglusFonts/**", "Assets.xcassets/**"]
      - path: App/TV
        # Linked into the tvOS Ren'Py frameworks (Scripts/tv/build-renpy-tv.sh).
        excludes: ["RenPyTVShims.m"]
      - path: App/RenPy
        excludes: ["*.py", "IAPHelper.m", "runtime_shim.c"]
      - path: App/RenPy/IAPHelper.m
        compilerFlags: ["-Wno-deprecated-declarations"]
      - path: App/RenPy/shiori_main.py
        buildPhase: resources
      - path: App/RenPy/shiori_main2.py
        buildPhase: resources
      - path: Vendor/RenPy7Base
        type: folder
        buildPhase: resources
      # Ren'Py 8.1.3's engine code and Python library, for Ren'Py 8.0 games.
      - path: Vendor/RenPy8Base
        type: folder
        buildPhase: resources
    info:
      path: App/TV/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GCSupportsGameMode: true
        GCSupportsControllerUserInteraction: true
        LSApplicationCategoryType: public.app-category.adventure-games
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      # No iCloud Documents for now: no tvOS profile with iCloud exists for this ID, and this
      # Mac can't make one (no account in Xcode). Until it's back, Apple TV saves sync only
      # through Steam Cloud (Ren'Py); Artemis and Luca saves stay on the box.
      path: App/TV/ShioriTV.entitlements
      properties: {}
    dependencies:
      - package: SteamKit
        product: SteamKit
      - package: ArtemisKit
        product: ArtemisKit
      - package: Kingfisher
      - package: LucaKit
        product: LucaKit
      # libvpx with tvOS slices (Scripts/luca/build-ios-vpx.sh): Luca movies and effects.
      - framework: Vendor/ShioriVPX.xcframework
        embed: false
      # Ren'Py runtimes retagged for tvOS (Scripts/tv/build-renpy-tv.sh), loaded as on iOS.
      - framework: Vendor/tv/RenPy8.xcframework
        embed: true
        link: false
      - framework: Vendor/tv/RenPy7.xcframework
        embed: true
        link: false
      - framework: Vendor/tv/MetalANGLE.xcframework
        embed: true
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: GameController.framework
      - sdk: ImageIO.framework
      - sdk: QuartzCore.framework
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owencramer.vnhub
        PRODUCT_NAME: Shiori
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shiori
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        SWIFT_OBJC_BRIDGING_HEADER: App/RenPy/Shiori-Bridging-Header.h
schemes:
  Shiori:
    build:
      targets:
        Shiori: all
  ShioriTV:
    build:
      targets:
        ShioriTV: all
