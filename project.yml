name: VNHub
options:
  bundleIdPrefix: com.owencramer
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SteamKit:
    path: Packages/SteamKit
targets:
  VNHub:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      - path: App/RenPy
        excludes: ["*.py"]
      - path: App/RenPy/vnhub_main.py
        buildPhase: resources
    # Merged with the generated Info.plist. Game folders in Documents show up in the Files
    # app and can be edited in place (no INFOPLIST_KEY_ build setting exists for these).
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    dependencies:
      - package: SteamKit
        product: SteamKit
      # Ren'Py runtime from Scripts/fetch-renios.sh.
      - framework: Vendor/renios/MetalANGLE.xcframework
        embed: true
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreMotion.framework
      - sdk: CoreServices.framework
      - sdk: GameController.framework
      - sdk: ImageIO.framework
      - sdk: QuartzCore.framework
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.owencramer.vnhub
        PRODUCT_NAME: VN Hub
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VN Hub
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: App/RenPy/VNHub-Bridging-Header.h
        # renios ships device libraries in release/ and simulator libraries in debug/.
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/Vendor/renios/prebuilt/release
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/Vendor/renios/prebuilt/debug
        OTHER_LDFLAGS:
          - -lrenpython
          - -lrenpy
          - -lpython3.9
          - -lavformat
          - -lavcodec
          - -lswscale
          - -lswresample
          - -lavutil
          - -lSDL2_image
          - -lSDL2
          - -lavif
          - -laom
          - -lturbojpeg
          - -lpng16
          - -lwebp
          - -lfribidi
          - -lfreetype
          - -lffi
          - -lssl
          - -lcrypto
          - -llzma
          - -lbz2
          - -lz
schemes:
  VNHub:
    build:
      targets:
        VNHub: all
